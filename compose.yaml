services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: geometrydash
      POSTGRES_USER: geometrydash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - geometrydash_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geometrydash -d geometrydash"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  geometrydash_pg:
